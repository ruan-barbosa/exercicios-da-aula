<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <img src="img/logo.png" alt="Ruview" class="logo">
        <section class="card-principal">
            <form action="cadastro.php" method="POST" class="form-login">

                <h1>Cadastro</h1>

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Escolha um nome" required>
                </div>

                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Digite um email" required>
                </div>
                
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Escolha uma senha" required minlength="6">
                </div>

                <button type="submit">Cadastrar</button>

            </form>
        </section>
        <div class="mudar-pagina"><a href="login.html">Já tenho conta</a></div>
    </main>
</body>
</html>
